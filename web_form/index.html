<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Nhật ký giao dịch | Vietnam Equity Toolkit</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #64748b;
      --line: #dbe4ea;
      --surface: #ffffff;
      --canvas: #f3f7f8;
      --brand: #0f766e;
      --brand-dark: #115e59;
      --danger: #b42318;
      --success: #067647;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #d8f3ef 0, transparent 32rem), var(--canvas);
      color: var(--ink);
    }
    .wrap { width: min(880px, calc(100% - 32px)); margin: 40px auto; }
    .intro { margin: 0 0 22px; }
    .eyebrow { color: var(--brand); font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .intro p { margin: 0; max-width: 620px; color: var(--muted); line-height: 1.6; }
    .card { padding: clamp(20px, 4vw, 36px); border: 1px solid #e3ebef; border-radius: 20px; background: var(--surface); box-shadow: 0 16px 45px #0f172a12; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 650; }
    .hint { display: block; margin-top: 5px; color: var(--muted); font-size: .78rem; }
    input, select, textarea {
      display: block; width: 100%; min-height: 46px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
      color: var(--ink); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #0f766e22; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
    button {
      min-height: 48px; padding: 0 22px; border: 0; border-radius: 11px;
      background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--brand-dark); }
    button:disabled { cursor: wait; opacity: .68; }
    .status { min-height: 24px; margin: 18px 0 0; font-size: .92rem; line-height: 1.5; }
    .status[data-kind="success"] { color: var(--success); }
    .status[data-kind="error"] { color: var(--danger); }
    .status[data-kind="info"] { color: #475569; }
    .privacy { margin: 20px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 22px, 880px); margin: 24px auto; }
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .field.full { grid-column: auto; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="intro">
      <div class="eyebrow">Vietnam Equity Toolkit</div>
      <h1>Ghi nhật ký giao dịch</h1>
      <p>Lưu lại quyết định đầu tư của bạn để theo dõi vị thế và đánh giá hiệu quả theo thời gian.</p>
    </header>

    <form class="card" id="trade-form" novalidate>
      <div class="grid">
        <div class="field">
          <label for="trade_date">Ngày giao dịch <span aria-hidden="true">*</span></label>
          <input id="trade_date" name="trade_date" type="date" required>
        </div>
        <div class="field">
          <label for="ticker">Mã cổ phiếu <span aria-hidden="true">*</span></label>
          <input id="ticker" name="ticker" type="text" maxlength="3" pattern="[A-Za-z]{3}" placeholder="FPT" autocomplete="off" required>
          <span class="hint">Nhập đúng 3 chữ cái.</span>
        </div>
        <div class="field">
          <label for="side">Loại lệnh <span aria-hidden="true">*</span></label>
          <select id="side" name="side" required>
            <option value="BUY">Mua (BUY)</option>
            <option value="SELL">Bán (SELL)</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Giá khớp (VND) <span aria-hidden="true">*</span></label>
          <input id="price" name="price" type="number" min="0.01" step="any" inputmode="decimal" required>
        </div>
        <div class="field">
          <label for="quantity">Khối lượng (cổ phiếu) <span aria-hidden="true">*</span></label>
          <input id="quantity" name="quantity" type="number" min="1" step="1" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="fee">Phí + thuế (VND)</label>
          <input id="fee" name="fee" type="number" min="0" step="any" inputmode="decimal" value="0">
        </div>
        <div class="field">
          <label for="stop_loss">Stop loss dự kiến (VND)</label>
          <input id="stop_loss" name="stop_loss" type="number" min="0.01" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="target">Giá mục tiêu (VND)</label>
          <input id="target" name="target" type="number" min="0.01" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="strategy_tag">Chiến lược</label>
          <input id="strategy_tag" name="strategy_tag" type="text" maxlength="100" placeholder="breakout, value, swing...">
        </div>
        <div class="field full">
          <label for="reason">Lý do vào/ra lệnh</label>
          <textarea id="reason" name="reason" maxlength="1000" placeholder="Ghi chú ngắn về luận điểm giao dịch..."></textarea>
        </div>
      </div>
      <div class="actions">
        <button id="submit-button" type="submit">Lưu giao dịch</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="privacy">Thông tin được gửi tới Google Sheet của bạn. Trade ID và thời điểm nhập sẽ được tạo tự động.</p>
    </form>
  </main>

  <script src="config.local.js"></script>
  <script>
    // Cấu hình riêng của máy được đọc từ tệp config.local.js đã bị loại khỏi Git.
    const APPS_SCRIPT_URL = window.APP_CONFIG?.appsScriptUrl || '';
    const FORM_TOKEN = window.APP_CONFIG?.formToken || '';

    const form = document.getElementById('trade-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');
    let sending = false;

    /** Hiển thị trạng thái gửi bằng thông báo dễ hiểu cho người dùng. */
    function showStatus(message, kind) {
      status.textContent = message;
      status.dataset.kind = kind;
    }

    /** Tạo YYYY-MM-DD theo múi giờ máy, tránh lệch ngày do chuyển sang UTC. */
    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    /** Kiểm tra cấu hình frontend trước khi gửi dữ liệu. */
    function configurationIsReady() {
      return APPS_SCRIPT_URL.startsWith('https://script.google.com/macros/s/') &&
        APPS_SCRIPT_URL.endsWith('/exec') &&
        FORM_TOKEN !== 'YOUR_FORM_TOKEN' && FORM_TOKEN.length >= 16;
    }

    /** Gom và chuẩn hóa dữ liệu form thành payload mà doPost nhận. */
    function createRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
      return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    /** Đọc trạng thái đã ghi vào Script Cache bằng JSONP, tránh phụ thuộc CORS. */
    function readRequestStatus(requestId) {
      return new Promise((resolve, reject) => {
        const callbackName = `tradeStatus_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement('script');
        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Hết thời gian chờ phản hồi.'));
        }, 5000);

        window[callbackName] = result => {
          window.clearTimeout(timeout);
          cleanup();
          resolve(result);
        };
        script.onerror = () => {
          window.clearTimeout(timeout);
          cleanup();
          reject(new Error('Không đọc được trạng thái từ Google.'));
        };
        const separator = APPS_SCRIPT_URL.includes('?') ? '&' : '?';
        script.src = `${APPS_SCRIPT_URL}${separator}request_id=${encodeURIComponent(requestId)}&callback=${encodeURIComponent(callbackName)}`;
        document.head.appendChild(script);
      });
    }

    /** Chờ backend xác nhận ghi hoặc trả lỗi, tối đa 30 giây. */
    async function waitForRequestStatus(requestId) {
      const deadline = Date.now() + 30000;
      while (Date.now() < deadline) {
        const result = await readRequestStatus(requestId);
        if (result && result.success !== undefined) return result;
        await new Promise(resolve => window.setTimeout(resolve, 1000));
      }
      throw new Error('Hết thời gian chờ xác nhận.');
    }

    /** Gom và chuẩn hóa dữ liệu form thành payload mà doPost nhận. */
    function buildPayload(requestId) {
      const data = new FormData(form);
      return {
        token: FORM_TOKEN,
        request_id: requestId,
        trade_date: String(data.get('trade_date') || ''),
        ticker: String(data.get('ticker') || '').trim().toUpperCase(),
        side: String(data.get('side') || ''),
        price: Number(data.get('price')),
        quantity: Number(data.get('quantity')),
        fee: data.get('fee') === '' ? 0 : Number(data.get('fee')),
        reason: String(data.get('reason') || '').trim(),
        stop_loss: data.get('stop_loss') === '' ? '' : Number(data.get('stop_loss')),
        target: data.get('target') === '' ? '' : Number(data.get('target')),
        strategy_tag: String(data.get('strategy_tag') || '').trim()
      };
    }

    /** Gửi một lệnh duy nhất; khóa nút trong lúc chờ để tránh gửi trùng. */
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (sending) return;

      if (!configurationIsReady()) {
        showStatus('Cần cấu hình URL Web app và token trước khi gửi.', 'error');
        return;
      }
      if (!form.reportValidity()) return;

      const requestId = createRequestId();
      const payload = buildPayload(requestId);
      if (!/^[A-Z]{3}$/.test(payload.ticker) || !Number.isInteger(payload.quantity) || payload.quantity <= 0) {
        showStatus('Vui lòng kiểm tra mã cổ phiếu và khối lượng.', 'error');
        return;
      }
      if (!Number.isFinite(payload.price) || payload.price <= 0 || !Number.isFinite(payload.fee) || payload.fee < 0) {
        showStatus('Giá phải lớn hơn 0 và phí không được âm.', 'error');
        return;
      }

      sending = true;
      button.disabled = true;
      button.textContent = 'Đang gửi...';
      showStatus('Đang gửi giao dịch, vui lòng chờ.', 'info');

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await waitForRequestStatus(requestId);
        if (!result.success) {
          showStatus(result.message || 'Không lưu được giao dịch. Vui lòng kiểm tra dữ liệu.', 'error');
          return;
        }
        showStatus(result.message || 'Đã lưu giao dịch thành công.', 'success');
        form.reset();
        document.getElementById('fee').value = '0';
        document.getElementById('trade_date').value = localDateString(new Date());
      } catch (error) {
        // Trạng thái chưa xác nhận; kiểm tra Sheet trước khi thử gửi lại để tránh ghi trùng.
        showStatus('Không đọc được phản hồi từ Google. Giao dịch có thể đã được ghi; hãy kiểm tra tab Trades trước khi gửi lại để tránh trùng.', 'error');
      } finally {
        sending = false;
        button.disabled = false;
        button.textContent = 'Lưu giao dịch';
      }
    });

    document.getElementById('trade_date').value = localDateString(new Date());
  </script>
</body>
</html>
